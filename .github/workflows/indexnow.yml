# After every successful production deploy on Vercel, tell IndexNow engines (Bing, and through it
# Copilot and ChatGPT search) which pages changed. Skips by itself until the site is live on its
# own domain (see scripts/indexnow.mjs). No secrets needed.
name: IndexNow

on:
  deployment_status:

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
